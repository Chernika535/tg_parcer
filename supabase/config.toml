# Конфиг проекта Supabase. project_id = ref вашего проекта
# (его видно в адресе дашборда: supabase.com/dashboard/project/<REF>).
# ВАЖНО: заменить REF на настоящий — пришлите его, я впишу.
project_id = "kklxahjnptrgnwcrpauh"

# Функции вызываются ДО входа (гостями), поэтому проверку JWT отключаем.
[functions.telegram-auth]
verify_jwt = false

[functions.read-channels]
verify_jwt = false

[functions.tg-connect]
verify_jwt = false

[functions.read-mt]
verify_jwt = false

[functions.img]
verify_jwt = false

[functions.feeds]
verify_jwt = false

[functions.myfeeds]
verify_jwt = false

# Кабинет автора. Функция сама проверяет JWT автора (как myfeeds), поэтому
# на шлюзе verify_jwt отключаем. bot-cron дёргает планировщик — без JWT.
[functions.bot]
verify_jwt = false

[functions.bot-cron]
verify_jwt = false

[functions.analytics]
verify_jwt = false

# Вебхук Telegram: приходит без JWT, проверяем секретным токеном внутри функции.
[functions.tg-webhook]
verify_jwt = false
